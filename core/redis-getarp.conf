# getarp: Redis listens only on a unix socket, and every client logs in as its
# own user (see /etc/redis/getarp-users.acl). Included at the end of redis.conf.
port 0
unixsocket /run/redis/redis-server.sock
unixsocketperm 770
aclfile /etc/redis/getarp-users.acl
maxmemory 256mb
maxmemory-policy noeviction

# getarp: Cowrie settings. Only what differs from Cowrie's bundled defaults.
# Emulated shell only: attackers never reach a real one.

[honeypot]
hostname = db-prod-01
log_path = /var/log/getarp/cowrie
state_path = /var/lib/cowrie
etc_path = /etc/cowrie
ttylog = true
report_public_ip = false
auth_class = UserDB

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
